name: Smoke Self-Hosted CI

on:
  workflow_dispatch:

jobs:
  mobile-web:
    name: ${{ matrix.config.project }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - project: Mobile Chrome
            credential_index: 0

          - project: Mobile Safari
            credential_index: 1

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-2.yml@main

    with:
      suite: Smoke
      command: test:smoke
      browser: ${{ matrix.config.project }}
      credential-index: ${{ matrix.config.credential_index }}
      runner: mobile

    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
