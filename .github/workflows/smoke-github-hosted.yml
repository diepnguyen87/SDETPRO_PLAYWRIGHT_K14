name: Smoke Github-Hosted CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  smoke:
    name: Smoke
    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-3.yml@v1.0.8
    with:
      suite: Smoke
      command: test:smoke
      image-tag: latest
      runner: ubuntu-latest

    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
