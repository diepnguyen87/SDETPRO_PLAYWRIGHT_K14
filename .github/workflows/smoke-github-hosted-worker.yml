name: Smoke Github-Hosted CI with Worker
run-name: ${{ inputs.suite }} (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Select test suite"
        required: true
        type: choice
        options:
          - Smoke
          - Regression
          - Sanity
        default: Smoke
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options:
          - SIT
          - UAT
        default: SIT

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      command: ${{ steps.set-command.outputs.command }}

    steps:
      - name: Map suite to command
        id: set-command
        shell: bash
        run: |
          projects="--project='*'"

          case "${{ inputs.suite }}" in
            Smoke)
              echo "command=test:smoke $projects" >> "$GITHUB_OUTPUT"
              ;;
            Regression)
              echo "command=test:regression $projects" >> "$GITHUB_OUTPUT"
              ;;
            Sanity)
              echo "command=test:sanity $projects" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported suite: ${{ inputs.suite }}"
              exit 1
              ;;
          esac

  execute:
    name: ${{ inputs.suite }} Testing
    needs: prepare
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 150

    env:
      IMAGE: 181221/playwright-framework:latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Image
        run: docker pull "$IMAGE"

      - name: Create .env file
        env:
          ENVIRONMENT_NAME: ${{ inputs.environment }}
          SHARED_ENV: ${{ secrets.ENV_FILE_BASE64 }}
          ENVIRONMENT_ENV: ${{ inputs.environment == 'UAT' && secrets.ENV_FILE_BASE64_UAT || inputs.environment == 'SIT' && secrets.ENV_FILE_BASE64_SIT || '' }}
        run: |
          if [ -n "$ENVIRONMENT_NAME" ] && [ -z "$ENVIRONMENT_ENV" ]; then
            echo "Missing environment secret ENV_FILE_BASE64_$ENVIRONMENT_NAME in environment '$ENVIRONMENT_NAME'"
            exit 1
          fi
          {
            echo "$SHARED_ENV" | base64 -d
            echo
            if [ -n "$ENVIRONMENT_ENV" ]; then echo "$ENVIRONMENT_ENV" | base64 -d; fi
          } > .env

      - name: Run Playwright Tests
        run: |
          docker run --rm \
            --env-file .env \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            "$IMAGE" \
            yarn ${{ needs.prepare.outputs.command }}

      - name: Upload Playwright HTML Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.environment }}-${{ inputs.suite }}-report
          path: playwright-report
          retention-days: 7

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              ${{ job.status == 'success' && '✅' || '❌' }} Playwright test: ${{ job.status }}
              Repository: ${{ github.repository }}
              Branch: ${{ github.ref_name }}
              Environment: ${{ inputs.environment }}
              Test suite: ${{ needs.prepare.outputs.command }}
              Triggered by: ${{ github.actor }}
              Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  generate-index:
    name: Publish Playwright Reports
    needs: execute
    if: always()
    runs-on: ubuntu-26.04

    concurrency:
      group: gh-pages-deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Remove old report
        shell: bash
        run: rm -rf "site/${{ inputs.environment }}-${{ inputs.suite }}-single-runner"

      - name: Download Playwright Report
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ inputs.environment }}-${{ inputs.suite }}-report
          path: site/${{ inputs.environment }}-${{ inputs.suite }}-single-runner

      - name: Generate index.html
        shell: bash
        run: |
          cd site

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Playwright Test Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }
              h1 {
                margin-bottom: 30px;
              }
              li {
                margin: 12px 0;
              }
              a {
                text-decoration: none;
                font-size: 18px;
              }
            </style>
          </head>
          <body>
            <h1>Playwright Test Reports</h1>
            <ul>
          EOF

          for dir in */; do
            if [ -f "$dir/index.html" ]; then
              name="${dir%/}"
              printf '              <li><a href="./%s/">%s</a></li>\n' \
                "$name" "$name" >> index.html
            fi
          done

          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false
