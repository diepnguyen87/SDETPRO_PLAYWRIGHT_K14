name: Smoke Github-Hosted CI with Matrix
run-name: ${{ inputs.suite }} (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Select test suite"
        required: true
        type: choice
        options:
          - Smoke
          - Regression
          - Sanity
        default: Smoke
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options:
          - SIT
          - UAT
        default: SIT

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      command: ${{ steps.set-command.outputs.command }}

    steps:
      - name: Map suite to command
        id: set-command
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            Smoke)
              echo "command=test:smoke" >> "$GITHUB_OUTPUT"
              ;;
            Regression)
              echo "command=test:regression" >> "$GITHUB_OUTPUT"
              ;;
            Sanity)
              echo "command=test:sanity" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported suite: ${{ inputs.suite }}"
              exit 1
              ;;
          esac

  execute:
    name: ${{ matrix.project }}
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Desktop Chromium
            credential_index: 0

          - project: Desktop Firefox
            credential_index: 1

          - project: Desktop Webkit
            credential_index: 2

          - project: Mobile Safari
            credential_index: 3

          - project: Mobile Chrome
            credential_index: 4

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-2.yml@b126fae6502dbb0bf27a5d35cde2304fe1b21329 # main
    with:
      environment: ${{ inputs.environment }}
      suite: ${{ inputs.suite }}
      command: ${{ needs.prepare.outputs.command }}
      browser: ${{ matrix.project }}
      credential-index: ${{ matrix.credential_index }}
      image-tag: latest
      runner: ubuntu-26.04
    secrets: inherit

  generate-index:
    name: Publish Playwright Reports
    needs: execute
    if: always()
    runs-on: ubuntu-26.04

    concurrency:
      group: gh-pages-deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Remove old reports
        shell: bash
        run: |
          for browser in "Desktop Chromium" "Desktop Firefox" "Desktop Webkit" "Mobile Safari" "Mobile Chrome"; do
            rm -rf "site/${{ inputs.environment }}-${{ inputs.suite }}-$browser"
          done

      - name: Download Playwright Reports
        uses: actions/download-artifact@v7
        with:
          pattern: "${{ inputs.suite }}-*-report"
          path: downloaded-reports
          merge-multiple: false

      - name: Rename report directories
        shell: bash
        run: |
          for report_dir in downloaded-reports/${{ inputs.suite }}-*-report; do
            [ -d "$report_dir" ] || continue
            name="$(basename "$report_dir")"
            mv "$report_dir" "site/${{ inputs.environment }}-${name%-report}"
          done

      - name: Generate index.html
        shell: bash
        run: |
          cd site

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Playwright Test Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }
              h1 {
                margin-bottom: 30px;
              }
              li {
                margin: 12px 0;
              }
              a {
                text-decoration: none;
                font-size: 18px;
              }
            </style>
          </head>
          <body>
            <h1>Playwright Test Reports</h1>
            <ul>
          EOF

          for dir in */; do
            if [ -f "$dir/index.html" ]; then
              name="${dir%/}"
              printf '              <li><a href="./%s/">%s</a></li>\n' \
                "$name" "$name" >> index.html
            fi
          done

          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false