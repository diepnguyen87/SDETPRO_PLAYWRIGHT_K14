services:
  playwright:
    build:
      context: .
      dockerfile: Dockerfile

    image: playwright-framework

    container_name: playwright-runner

    command: sh run-tests.sh

    env_file:
      - .env
      - .env.${TEST_ENV:-sit}

    volumes:
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./test-results:/app/test-results
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs

  # RAG vector store (yarn rag:ingest / rag:search); only started with `docker compose --profile rag up -d qdrant`
  qdrant:
    image: qdrant/qdrant:v1.20.2

    container_name: rag-qdrant

    profiles: ["rag"]

    ports:
      - "6333:6333"

    volumes:
      - ./.qdrant-data:/qdrant/storage
