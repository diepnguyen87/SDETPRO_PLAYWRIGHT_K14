name: Smoke Github-Hosted CI with Sharding
run-name: ${{ inputs.suite }} (${{ inputs.environment }})

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Select test suite"
        required: true
        type: choice
        options:
          - Smoke
          - Regression
          - Sanity
        default: Smoke
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options:
          - SIT
          - UAT
        default: SIT

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.set-command.outputs.command }}

    steps:
      - name: Map suite to command
        id: set-command
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            Smoke)
              echo "command=test:smoke" >> "$GITHUB_OUTPUT"
              ;;
            Regression)
              echo "command=test:regression" >> "$GITHUB_OUTPUT"
              ;;
            Sanity)
              echo "command=test:sanity" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported suite: ${{ inputs.suite }}"
              exit 1
              ;;
          esac

  execute:
    name: Shard ${{ matrix.shard }}
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            credential_index: 0

          - shard: 2
            credential_index: 1

          - shard: 3
            credential_index: 2

          - shard: 4
            credential_index: 3

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-4.yml@b126fae6502dbb0bf27a5d35cde2304fe1b21329 # main
    with:
      environment: ${{ inputs.environment }}
      suite: ${{ inputs.suite }}
      command: ${{ needs.prepare.outputs.command }}
      shard-index: ${{ matrix.shard }}
      shard-total: 4
      credential-index: ${{ matrix.credential_index }}
      image-tag: latest
      runner: ubuntu-latest

    secrets: inherit

  merge-reports:
    name: Merge Playwright Reports
    needs: execute
    if: always()
    runs-on: ubuntu-26.04

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Image
        run: docker pull 181221/playwright-framework:latest

      - name: Download Blob Reports
        uses: actions/download-artifact@v6
        with:
          pattern: ${{ inputs.suite }}-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into HTML Report
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/all-blob-reports:/app/all-blob-reports \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            181221/playwright-framework:latest \
            npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.suite }}-sharded-report
          path: playwright-report
          retention-days: 7

  generate-index:
    name: Publish Playwright Reports
    needs: merge-reports
    if: always()
    runs-on: ubuntu-latest

    concurrency:
      group: gh-pages-deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Remove old report
        shell: bash
        run: rm -rf "site/${{ inputs.environment }}-${{ inputs.suite }}-sharded"

      - name: Download Playwright Report
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          name: ${{ inputs.suite }}-sharded-report
          path: site/${{ inputs.environment }}-${{ inputs.suite }}-sharded

      - name: Generate index.html
        shell: bash
        run: |
          cd site

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Playwright Test Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }
              h1 {
                margin-bottom: 30px;
              }
              li {
                margin: 12px 0;
              }
              a {
                text-decoration: none;
                font-size: 18px;
              }
            </style>
          </head>
          <body>
            <h1>Playwright Test Reports</h1>
            <ul>
          EOF

          for dir in */; do
            if [ -f "$dir/index.html" ]; then
              name="${dir%/}"
              printf '              <li><a href="./%s/">%s</a></li>\n' \
                "$name" "$name" >> index.html
            fi
          done

          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: false
