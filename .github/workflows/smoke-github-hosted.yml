name: Smoke Github-Hosted CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  smoke:
    name: Smoke Testing
    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-3.yml@v1.0.11
    with:
      suite: Smoke
      command: test:smoke
      image-tag: latest
      runner: ubuntu-latest

    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}

  generate-index:
    needs: smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages

      - name: Generate index.html
        shell: bash
        run: |
          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Playwright Test Reports</title>

            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }

              h1 {
                margin-bottom: 30px;
              }

              li {
                margin: 12px 0;
              }

              a {
                text-decoration: none;
                font-size: 18px;
              }
            </style>
          </head>

          <body>
            <h1>Playwright Test Reports</h1>

            <ul>
          EOF

          for dir in */; do
            if [ -f "$dir/index.html" ]; then
              name="${dir%/}"
              echo "              <li><a href=\"./$name/\">$name</a></li>" >> index.html
            fi
          done

          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "No changes to index.html"
          else
            git commit -m "docs: update Playwright report index"
            git push origin gh-pages
          fi
