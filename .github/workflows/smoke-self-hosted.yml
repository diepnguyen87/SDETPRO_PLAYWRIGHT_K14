name: Smoke Self-Hosted CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select test environment"
        required: true
        type: choice
        options:
          - SIT
          - UAT
        default: SIT

run-name: Smoke (${{ inputs.environment }})

jobs:
  mobile-web:
    name: ${{ matrix.config.project }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - project: Mobile Chrome
            credential_index: 0

          - project: Mobile Safari
            credential_index: 1

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-2.yml@b126fae6502dbb0bf27a5d35cde2304fe1b21329 # main

    with:
      environment: ${{ inputs.environment }}
      suite: Smoke
      command: test:smoke
      browser: ${{ matrix.config.project }}
      credential-index: ${{ matrix.config.credential_index }}
      runner: mobile

    secrets: inherit
