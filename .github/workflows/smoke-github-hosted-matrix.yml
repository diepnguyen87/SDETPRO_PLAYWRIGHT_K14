name: Smoke Github-Hosted CI with Matrix

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Select test suite"
        required: true
        type: choice
        options:
          - Smoke
          - Regression
          - Sanity
        default: Smoke

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.set-command.outputs.command }}

    steps:
      - name: Map suite to command
        id: set-command
        shell: bash
        run: |
          case "${{ inputs.suite }}" in
            Smoke)
              echo "command=test:smoke" >> "$GITHUB_OUTPUT"
              ;;
            Regression)
              echo "command=test:regression" >> "$GITHUB_OUTPUT"
              ;;
            Sanity)
              echo "command=test:sanity" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported suite: ${{ inputs.suite }}"
              exit 1
              ;;
          esac

  execute:
    name: ${{ matrix.project }}
    needs: prepare

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Desktop Chromium
            credential_index: 0

          - project: Desktop Firefox
            credential_index: 1

          - project: Desktop WebKit
            credential_index: 2

          - project: Mobile Safari
            credential_index: 3

          - project: Mobile Chrome
            credential_index: 4

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-2.yml@main
    with:
      suite: ${{ inputs.suite }}
      command: ${{ needs.prepare.outputs.command }}
      browser: ${{ matrix.project }}
      credential-index: ${{ matrix.credential_index }}
      image-tag: latest
      runner: ubuntu-latest
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}

  generate-index:
    name: Publish Playwright Reports
    needs: execute
    if: always()
    runs-on: ubuntu-latest

    concurrency:
      group: gh-pages-deploy-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: site

      - name: Download Playwright Reports
        uses: actions/download-artifact@v6
        with:
          pattern: "${{ inputs.suite }}-*-report"
          path: downloaded-reports
          merge-multiple: false

      - name: Update report directories
        shell: bash
        run: |
          mkdir -p site

          for report_dir in downloaded-reports/${{ inputs.suite }}-*-report; do
            [ -d "$report_dir" ] || continue

            name=$(basename "$report_dir" -report)

            if [ ! -f "$report_dir/index.html" ]; then
              echo "No index.html found in $report_dir"
              continue
            fi

            echo "Updating report: $name"

            rm -rf "site/$name"
            mkdir -p "site/$name"
            cp -a "$report_dir/." "site/$name/"
          done

      - name: Generate index.html
        shell: bash
        run: |
          cd site

          cat > index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Playwright Test Reports</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 40px;
              }
              h1 {
                margin-bottom: 30px;
              }
              li {
                margin: 12px 0;
              }
              a {
                text-decoration: none;
                font-size: 18px;
              }
            </style>
          </head>
          <body>
            <h1>Playwright Test Reports</h1>
            <ul>
          EOF

          for dir in */; do
            if [ -f "$dir/index.html" ]; then
              name="${dir%/}"
              printf '              <li><a href="./%s/">%s</a></li>\n' \
                "$name" "$name" >> index.html
            fi
          done

          cat >> index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Publish reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
          keep_files: true