name: Smoke Self-Hosted CI

on:
  workflow_dispatch:

jobs:
  mobile-web:
    name: Mobile Web - ${{ matrix.config.project }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - project: Mobile Chrome
            engine: chromium

          - project: Mobile Safari
            engine: webkit

    uses: diepnguyen87/automation-workflows/.github/workflows/reusable-playwright-2.yml@v1.0.1

    with:
      command: test:smoke
      browser: ${{ matrix.config.project }}
      engine: ${{ matrix.config.engine }}
      runner: mobile

    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
